<div class="sidenav" [ngClass]="isSidebarCollapsed ? 'sidenav-collapsed': ''">
    <div class="logo-container">
        <button class="logo" (click)="toggleSidebar()">
            <img class="myImg" src="/assets/home-mp.png" />
        </button>
        <div class="logo-text" *ngIf="isSidebarCollapsed">Grupo MP</div>
        <button class="btn-close" *ngIf="isSidebarCollapsed" (click)="closeSidenav()">
            <i class="fa fa-times" aria-hidden="true"></i>
        </button>
    </div>
    <ul class="sidenav-nav">
        <li class="sidenav-nav-item" *ngFor="let data of navData">
            <a class="sidenav-nav-link" [routerLink]="[data.routeLink]" routerLinkActive="active"
                [routerLinkActiveOptions]="{exact: true}">
                <i class="sidenav-link-icon" [class]="data.icon"></i>
                <span class="sidenav-link-text" *ngIf="isSidebarCollapsed">
                    {{data.label}}
                </span>
            </a>
        </li>
    </ul>
</div>
