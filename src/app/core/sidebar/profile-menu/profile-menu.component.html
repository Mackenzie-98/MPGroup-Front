<div class="profile-container">
    <button (click)="toggleProfileMenu()" class="profile-button">
        <div class="profile-img" *ngIf="userInitials">{{ userInitials }}</div>
    </button>
    <div *ngIf="isProfileMenuOpen" class="profile-menu">
        <div class="profile-header">
            <img src="assets/user-avatar.png" alt="User Avatar" class="profile-avatar">
            <div class="profile-info">
                <p class="profile-name">{{ userName }}</p>
                <p class="profile-email">{{ userEmail }}</p>
            </div>
        </div>
        <div class="profile-menu-items">
            <button class="profile-menu-item" (click)="navigateToProfile()">
                <i class="fas fa-user-cog"></i> Configurar perfil
            </button>
            <button (click)="logout()" class="profile-menu-item">
                <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
            </button>
        </div>
    </div>
</div>
