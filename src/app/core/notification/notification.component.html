<div *ngIf="message" @fade [ngClass]="{
    'bg-red-100 border-red-400 text-red-700': type === 'error',
    'bg-green-100 border-green-400 text-green-700': type === 'success',
    'bg-blue-100 border-blue-400 text-blue-700': type === 'info'
  }" class="notification-bar px-4 py-3 rounded shadow-lg flex items-center justify-between">
    <span class="text-sm">{{ message }}</span>
    <button (click)="close()" class="text-sm font-bold ml-4"
        [ngClass]="{'text-red-700': type === 'error', 'text-green-700': type === 'success', 'text-blue-700': type === 'info'}">
        X
    </button>
</div>
